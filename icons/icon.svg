<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f0f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#83f083;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4CAF50;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Фон -->
  <rect width="512" height="512" fill="url(#bg)" rx="64"/>
  
  <!-- Фильтр -->
  <g transform="translate(128, 128)">
    <!-- Основа фильтра -->
    <rect x="0" y="80" width="256" height="96" fill="url(#accent)" rx="12"/>
    
    <!-- Верхняя часть -->
    <rect x="32" y="32" width="192" height="64" fill="url(#accent)" rx="8"/>
    
    <!-- Центральная часть -->
    <rect x="64" y="0" width="128" height="48" fill="url(#accent)" rx="6"/>
    
    <!-- Детали -->
    <circle cx="96" cy="24" r="8" fill="#1a1a1a"/>
    <circle cx="160" cy="24" r="8" fill="#1a1a1a"/>
    <circle cx="128" cy="112" r="12" fill="#1a1a1a"/>
    
    <!-- Текст -->
    <text x="128" y="200" text-anchor="middle" fill="url(#accent)" font-family="Arial, sans-serif" font-size="24" font-weight="bold">АнроТех</text>
  </g>
</svg>
